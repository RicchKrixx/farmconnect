<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Register as a Farmer – FarmConnect Ghana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Manrope', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            forest: '#173F35',
                            green: '#5D8B52',
                            terra: '#C97955',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-image: url('/assets/bg.jpg');
            background-size: contain;
            background-attachment: fixed;
            background-position: center;
        }
        

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px 0 rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col overlay">

    <div class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl w-full space-y-8 glass p-8 sm:p-10 rounded-3xl relative">
            
            <!-- Back to Home Link -->
            <a href="/" class="absolute top-6 left-6 sm:top-8 sm:left-8 text-slate-500 hover:text-brand-green transition flex items-center gap-2 font-medium">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>

            <div class="text-center pt-8">
                <div class="mx-auto w-16 h-16 bg-brand-green/20 text-brand-green rounded-full flex items-center justify-center text-3xl mb-4">
                    <i class="fa-solid fa-tractor"></i>
                </div>
                <h2 class="text-3xl font-display font-extrabold text-brand-forest">Join FarmConnect</h2>
                <p class="mt-2 text-slate-600">Register your farm to start selling directly to buyers across Ghana.</p>
            </div>

            <form class="mt-8 space-y-6" onsubmit="handleRegistration(event)">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="fullName" class="block text-sm font-bold text-slate-700 mb-1">Full Name</label>
                        <input id="fullName" name="fullName" type="text" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white/80 focus:ring-2 focus:ring-brand-green outline-none transition" placeholder="Andy Wordey">
                    </div>
                    <div>
                        <label for="farmName" class="block text-sm font-bold text-slate-700 mb-1">Farm or Company Name</label>
                        <input id="farmName" name="farmName" type="text" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white/80 focus:ring-2 focus:ring-brand-green outline-none transition" placeholder="Wordey Valley Farm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="phone" class="block text-sm font-bold text-slate-700 mb-1">Phone Number</label>
                        <input id="phone" name="phone" type="tel" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white/80 focus:ring-2 focus:ring-brand-green outline-none transition" placeholder="024 123 4567">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-bold text-slate-700 mb-1">Email Address</label>
                        <input id="email" name="email" type="email" class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white/80 focus:ring-2 focus:ring-brand-green outline-none transition" placeholder="you@example.com">
                    </div>
                </div>

                <div>
                    <label for="region" class="block text-sm font-bold text-slate-700 mb-1">Region / Location</label>
                    <select id="region" name="region" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white/80 focus:ring-2 focus:ring-brand-green outline-none transition cursor-pointer appearance-none">
                        <option value="">Select a region...</option>
                        <option value="Ahafo">Ahafo Region</option>
                        <option value="Ashanti">Ashanti Region</option>
                        <option value="Bono">Bono Region</option>
                        <option value="Bono East">Bono East Region</option>
                        <option value="Central">Central Region</option>
                        <option value="Eastern">Eastern Region</option>
                        <option value="Greater Accra">Greater Accra Region</option>
                        <option value="Northern">Northern Region</option>
                        <option value="Oti">Oti Region</option>
                        <option value="Savannah">Savannah Region</option>
                        <option value="Upper East">Upper East Region</option>
                        <option value="Upper West">Upper West Region</option>
                        <option value="Volta">Volta Region</option>
                        <option value="Western">Western Region</option>
                        <option value="Western North">Western North Region</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Types of Product (Select all that apply)</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-white/50 p-4 rounded-xl border border-slate-200">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="text-brand-green focus:ring-brand-green w-4 h-4 rounded border-slate-300"> <span class="text-sm">Vegetables</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="text-brand-green focus:ring-brand-green w-4 h-4 rounded border-slate-300"> <span class="text-sm">Fruits</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="text-brand-green focus:ring-brand-green w-4 h-4 rounded border-slate-300"> <span class="text-sm">Grains</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="text-brand-green focus:ring-brand-green w-4 h-4 rounded border-slate-300"> <span class="text-sm">Tubers</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="text-brand-green focus:ring-brand-green w-4 h-4 rounded border-slate-300"> <span class="text-sm">Poultry</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="text-brand-green focus:ring-brand-green w-4 h-4 rounded border-slate-300"> <span class="text-sm">Livestock</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="text-brand-green focus:ring-brand-green w-4 h-4 rounded border-slate-300"> <span class="text-sm">Legumes</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="text-brand-green focus:ring-brand-green w-4 h-4 rounded border-slate-300"> <span class="text-sm">Spices</span></label>
                    </div>
                </div>

                <div>
                    <label for="description" class="block text-sm font-bold text-slate-700 mb-1">Description</label>
                    <textarea id="description" name="description" rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white/80 focus:ring-2 focus:ring-brand-green outline-none transition resize-none" placeholder="Tell us a little about your farming methods and scale..."></textarea>
                </div>

                <div class="pt-2">
                    <button id="submitBtn" type="submit" class="w-full flex justify-center items-center gap-2 py-4 px-4 border border-transparent rounded-xl shadow-lg text-lg font-bold text-white bg-brand-forest hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-forest transition">
                        Submit Application
                    </button>
                    <p class="text-xs text-center text-slate-500 mt-4">By submitting, you agree to our Terms of Service and Privacy Policy.</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function handleRegistration(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Submitting...';
            
            setTimeout(() => {
                btn.classList.remove('bg-brand-forest', 'hover:bg-opacity-90');
                btn.classList.add('bg-brand-green');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Registration Successful!';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
            }, 1500);
        }
    </script>
</body>
</html>
